name: Credentials Health Check

# Verifies every secret the blog pipeline depends on and emails the site
# admins (via the website's /api/blog-pipeline/alert endpoint) when one has
# stopped working. Runs weekly so a stale token is caught days before the
# monthly pipeline needs it, and can be run on demand after rotating a secret
# to confirm the new value works.

on:
  schedule:
    # 13:07 UTC every Monday = 8:07 AM Central (CDT) / 7:07 AM (CST).
    - cron: '7 13 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify every pipeline credential
        env:
          CONTENTFUL_CMA_TOKEN: ${{ secrets.CONTENTFUL_CMA_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ secrets.CONTENTFUL_ENVIRONMENT || 'master' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          BLOG_API_BASE: ${{ vars.BLOG_API_BASE || 'https://speakabout.ai/api/blog-pipeline' }}
          BLOG_PIPELINE_API_KEY: ${{ secrets.BLOG_PIPELINE_API_KEY }}
        run: python check_credentials.py --all --notify
